<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 3D 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }
  .game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #1a1a2e;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(0,255,255,0.5);
    z-index: 10;
    background: rgba(0,0,0,0.5);
    padding: 10px 25px;
    border-radius: 30px;
    border: 1px solid rgba(0,255,255,0.3);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .hud .score-label {
    color: #0ff;
  }
  .hud .score-value {
    color: #fff;
    font-size: 26px;
  }
  .controls {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .controls button {
    background: linear-gradient(135deg, #00bcd4, #0097a7);
    color: #fff;
    border: none;
    padding: 12px 35px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,188,212,0.3);
    letter-spacing: 1px;
  }
  .controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(0,188,212,0.5);
  }
  .controls button:active {
    transform: translateY(0);
  }
  .key-hint {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    color: #ff4081;
    font-size: 48px;
    font-weight: bold;
    text-shadow: 0 0 40px rgba(255,64,129,0.8);
    display: none;
    text-align: center;
    line-height: 1.4;
  }
  .game-over .sub {
    font-size: 20px;
    color: rgba(255,255,255,0.7);
    text-shadow: none;
  }
  @media (max-width: 600px) {
    .hud { font-size: 16px; padding: 8px 16px; gap: 15px; }
    .hud .score-value { font-size: 20px; }
    .game-over { font-size: 32px; }
    .game-over .sub { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="hud">
    <span class="score-label">🏆 得分</span>
    <span class="score-value" id="scoreDisplay">0</span>
  </div>
  <div id="gameOver" class="game-over">
    💀 游戏结束<br>
    <span class="sub" id="finalScore">得分: 0</span>
    <span class="sub" style="display:block;font-size:16px;margin-top:10px;">按 R 重新开始</span>
  </div>
  <div id="gameCanvas"></div>
  <div class="controls">
    <button id="restartBtn">🔄 重新开始</button>
    <div class="key-hint">↑ ↓ ← → 或 WASD 控制方向 &nbsp;|&nbsp; 空格键快速落下</div>
  </div>
</div>

<!-- Three.js from CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------- 游戏配置 -------
const GRID_SIZE = 16;
const CELL_SIZE = 1.0;
const MOVE_INTERVAL = 280; // ms

// ------- DOM 元素 -------
const container = document.getElementById('gameCanvas');
const scoreDisplay = document.getElementById('scoreDisplay');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');

// ------- Three.js 场景 -------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 12, 25);

const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 50);
camera.position.set(10, 12, 10);
camera.lookAt(GRID_SIZE/2, 0, GRID_SIZE/2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Orbit Controls (for debug / user can orbit)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(GRID_SIZE/2, 0, GRID_SIZE/2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();
controls.enableRotate = true;
controls.enablePan = false;

// ------- 灯光 -------
// 环境光
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);

// 主方向光
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(10, 20, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 40;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

// 填充光
const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
fillLight.position.set(-5, 5, -10);
scene.add(fillLight);

// 背光
const backLight = new THREE.DirectionalLight(0xff4488, 0.3);
backLight.position.set(-5, 3, 10);
scene.add(backLight);

// ------- 地面/网格底板 -------
const groundGeometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x16213e,
  roughness: 0.7,
  metalness: 0.1,
  transparent: true,
  opacity: 0.9,
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.set(GRID_SIZE/2, -0.01, GRID_SIZE/2);
ground.receiveShadow = true;
scene.add(ground);

// 网格线
const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x0ff, 0x3366aa);
gridHelper.position.set(GRID_SIZE/2, 0, GRID_SIZE/2);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// 发光边框
const borderMat = new THREE.LineBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.3 });
const borderPoints = [
  new THREE.Vector3(0, 0.05, 0),
  new THREE.Vector3(GRID_SIZE, 0.05, 0),
  new THREE.Vector3(GRID_SIZE, 0.05, GRID_SIZE),
  new THREE.Vector3(0, 0.05, GRID_SIZE),
  new THREE.Vector3(0, 0.05, 0),
];
const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPoints);
const borderLine = new THREE.Line(borderGeo, borderMat);
scene.add(borderLine);

// 边界墙 - 半透明发光柱子
function createCornerLight(x, z) {
  const geo = new THREE.CylinderGeometry(0.08, 0.15, 3, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x00ccff,
    emissive: 0x00ccff,
    emissiveIntensity: 0.3,
    transparent: true,
    opacity: 0.5,
  });
  const pillar = new THREE.Mesh(geo, mat);
  pillar.position.set(x, 1.5, z);
  scene.add(pillar);
}
createCornerLight(0, 0);
createCornerLight(GRID_SIZE, 0);
createCornerLight(0, GRID_SIZE);
createCornerLight(GRID_SIZE, GRID_SIZE);

// ------- 背景星星效果 -------
const starsGeo = new THREE.BufferGeometry();
const starsCount = 500;
const starPos = new Float32Array(starsCount * 3);
for (let i = 0; i < starsCount * 3; i++) {
  starPos[i] = (Math.random() - 0.5) * 100;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6 });
const stars = new THREE.Points(starsGeo, starsMat);
stars.position.set(GRID_SIZE/2, 5, GRID_SIZE/2);
scene.add(stars);

// ------- 游戏状态 -------
let snake = [];
let direction = { x: 1, z: 0 };
let nextDirection = { x: 1, z: 0 };
let food = null;
let score = 0;
let gameRunning = true;
let gameLoopId = null;
let moveTimer = 0;

// 3D 对象组
let snakeMeshes = [];
let foodMesh = null;
let floorCells = [];

// 地板单元格发光效果
function createFloorCell(x, z) {
  const geo = new THREE.PlaneGeometry(0.9, 0.9);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x16213e,
    roughness: 0.5,
    metalness: 0.3,
    transparent: true,
    opacity: 0.3,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x + 0.5, 0.001, z + 0.5);
  mesh.userData = { x, z };
  scene.add(mesh);
  return mesh;
}

// 创建蛇节
function createSnakeSegment(pos, isHead = false, index = 0) {
  const size = 0.85;
  const geo = new THREE.BoxGeometry(size, size, size);
  
  let color, emissive, emissiveIntensity;
  if (isHead) {
    color = 0x00e5ff;
    emissive = 0x00e5ff;
    emissiveIntensity = 0.3;
  } else {
    // 渐变：从青色到紫色
    const t = Math.min(index / 12, 1);
    const c = new THREE.Color();
    c.setHSL(0.55 - t * 0.2, 0.9, 0.4 + (1 - t) * 0.3);
    color = c;
    emissive = c;
    emissiveIntensity = 0.15;
  }
  
  const mat = new THREE.MeshStandardMaterial({
    color,
    emissive,
    emissiveIntensity,
    roughness: 0.2,
    metalness: 0.6,
    transparent: true,
    opacity: 0.95,
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(pos.x + 0.5, size/2, pos.z + 0.5);
  mesh.userData = { isHead };
  
  // 蛇头加眼睛
  if (isHead) {
    createEyes(mesh, direction);
  }
  
  return mesh;
}

let eyeMeshes = [];

function createEyes(headMesh, dir) {
  // 清除旧眼睛
  eyeMeshes.forEach(e => {
    headMesh.remove(e);
    scene.remove(e);
  });
  eyeMeshes = [];
  
  const eyeMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 0.3,
    roughness: 0.1,
  });
  const pupilMat = new THREE.MeshStandardMaterial({
    color: 0x000000,
    roughness: 0.1,
  });
  
  const eyeGeo = new THREE.SphereGeometry(0.18, 8, 8);
  const pupilGeo = new THREE.SphereGeometry(0.08, 8, 8);
  
  let e1Pos, e2Pos;
  const off = 0.25;
  const fwd = 0.35;
  
  if (dir.x === 1) {
    e1Pos = [fwd, 0.1, -off];
    e2Pos = [fwd, 0.1, off];
  } else if (dir.x === -1) {
    e1Pos = [-fwd, 0.1, -off];
    e2Pos = [-fwd, 0.1, off];
  } else if (dir.z === -1) {
    e1Pos = [-off, 0.1, -fwd];
    e2Pos = [off, 0.1, -fwd];
  } else {
    e1Pos = [-off, 0.1, fwd];
    e2Pos = [off, 0.1, fwd];
  }
  
  [e1Pos, e2Pos].forEach(pos => {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(pos[0], pos[1], pos[2]);
    eye.scale.set(1, 0.7, 0.7);
    headMesh.add(eye);
    eyeMeshes.push(eye);
    
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.scale.set(1, 0.7, 0.7);
    if (dir.x === 1) pupil.position.set(0.12, 0, 0);
    else if (dir.x === -1) pupil.position.set(-0.12, 0, 0);
    else if (dir.z === -1) pupil.position.set(0, 0, -0.12);
    else pupil.position.set(0, 0, 0.12);
    eye.add(pupil);
  });
}

// 创建食物
function createFood(pos) {
  if (foodMesh) {
    scene.remove(foodMesh);
    foodMesh = null;
  }
  
  const group = new THREE.Group();
  
  // 核心球体
  const coreGeo = new THREE.SphereGeometry(0.35, 16, 16);
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0xff4081,
    emissive: 0xff4081,
    emissiveIntensity: 0.6,
    roughness: 0.1,
    metalness: 0.3,
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.y = 0.35;
  group.add(core);
  
  // 外发光光环
  const glowGeo = new THREE.SphereGeometry(0.5, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xff4081,
    transparent: true,
    opacity: 0.15,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.y = 0.35;
  group.add(glow);
  
  // 旋转环
  const ringGeo = new THREE.TorusGeometry(0.5, 0.03, 8, 24);
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0xff80ab,
    emissive: 0xff4081,
    emissiveIntensity: 0.2,
    transparent: true,
    opacity: 0.7,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = 0.35;
  ring.rotation.x = Math.PI / 2;
  group.add(ring);
  
  const ring2 = ring.clone();
  ring2.rotation.z = Math.PI / 3;
  group.add(ring2);
  
  group.position.set(pos.x + 0.5, 0, pos.z + 0.5);
  group.userData = { ring, ring2 };
  
  scene.add(group);
  return group;
}

// ------- 粒子效果 -------
const particleGroup = new THREE.Group();
scene.add(particleGroup);

function spawnEatParticles(pos) {
  const count = 20;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const velocities = [];
  
  for (let i = 0; i < count; i++) {
    positions[i*3] = pos.x + 0.5;
    positions[i*3+1] = 0.5;
    positions[i*3+2] = pos.z + 0.5;
    
    const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.25, 0.9, 0.6);
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
    
    velocities.push({
      x: (Math.random() - 0.5) * 0.2,
      y: Math.random() * 0.15 + 0.05,
      z: (Math.random() - 0.5) * 0.2,
    });
  }
  
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const mat = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
  });
  
  const mesh = new THREE.Points(geo, mat);
  mesh.userData = { velocities, life: 1.0 };
  particleGroup.add(mesh);
}

function updateParticles() {
  const toRemove = [];
  particleGroup.children.forEach((mesh, idx) => {
    const pos = mesh.geometry.attributes.position;
    const vel = mesh.userData.velocities;
    mesh.userData.life -= 0.025;
    
    if (mesh.userData.life <= 0) {
      toRemove.push(idx);
      return;
    }
    
    mesh.material.opacity = mesh.userData.life;
    mesh.scale.setScalar(1 + (1 - mesh.userData.life) * 2);
    
    for (let i = 0; i < vel.length; i++) {
      pos.array[i*3] += vel[i].x;
      pos.array[i*3+1] += vel[i].y;
      pos.array[i*3+2] += vel[i].z;
      vel[i].y -= 0.008; // gravity
    }
    pos.needsUpdate = true;
  });
  
  toRemove.reverse().forEach(i => {
    const m = particleGroup.children[i];
    particleGroup.remove(m);
    m.geometry.dispose();
    m.material.dispose();
  });
}

// ------- 游戏逻辑 -------
function init() {
  // 清除旧蛇
  snakeMeshes.forEach(m => scene.remove(m));
  snakeMeshes = [];
  eyeMeshes.forEach(e => {
    if (e.parent) e.parent.remove(e);
    scene.remove(e);
  });
  eyeMeshes = [];
  
  if (foodMesh) {
    scene.remove(foodMesh);
    foodMesh = null;
  }
  
  // 清除粒子
  while (particleGroup.children.length > 0) {
    const m = particleGroup.children[0];
    particleGroup.remove(m);
    m.geometry.dispose();
    m.material.dispose();
  }
  
  // 重置状态
  const mid = Math.floor(GRID_SIZE / 2);
  snake = [
    { x: mid, z: mid },
    { x: mid - 1, z: mid },
    { x: mid - 2, z: mid },
  ];
  direction = { x: 1, z: 0 };
  nextDirection = { x: 1, z: 0 };
  score = 0;
  gameRunning = true;
  moveTimer = 0;
  scoreDisplay.textContent = '0';
  gameOverEl.style.display = 'none';
  
  // 创建蛇的3D模型
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const mesh = createSnakeSegment(seg, isHead, i);
    snakeMeshes.push(mesh);
    scene.add(mesh);
  });
  // 更新眼睛方向
  updateEyes(direction);
  
  // 生成食物
  spawnFood3D();
  
  // 创建地板单元格
  floorCells.forEach(m => scene.remove(m));
  floorCells = [];
  for (let x = 0; x < GRID_SIZE; x++) {
    for (let z = 0; z < GRID_SIZE; z++) {
      floorCells.push(createFloorCell(x, z));
    }
  }
  
  // 停止旧循环
  if (gameLoopId) {
    cancelAnimationFrame(gameLoopId);
  }
  gameLoopId = requestAnimationFrame(gameLoop);
}

function spawnFood3D() {
  let pos;
  while (true) {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE),
      z: Math.floor(Math.random() * GRID_SIZE)
    };
    if (!snake.some(s => s.x === pos.x && s.z === pos.z)) break;
  }
  food = pos;
  foodMesh = createFood(pos);
}

function updateEyes(dir) {
  // 更新蛇头眼睛方向
  const headMesh = snakeMeshes[0];
  if (headMesh) {
    // 移除旧眼睛
    eyeMeshes.forEach(e => {
      if (e.parent) e.parent.remove(e);
    });
    eyeMeshes = [];
    createEyes(headMesh, dir);
  }
}

function moveSnake() {
  if (!gameRunning) return;
  
  direction = { ...nextDirection };
  
  const head = {
    x: snake[0].x + direction.x,
    z: snake[0].z + direction.z
  };
  
  // 撞墙检测
  if (head.x < 0 || head.x >= GRID_SIZE || head.z < 0 || head.z >= GRID_SIZE) {
    gameOver3D();
    return;
  }
  
  // 撞自身检测
  if (snake.some(s => s.x === head.x && s.z === head.z)) {
    gameOver3D();
    return;
  }
  
  snake.unshift(head);
  
  // 吃食物
  if (head.x === food.x && head.z === food.z) {
    score++;
    scoreDisplay.textContent = score;
    spawnEatParticles(food);
    spawnFood3D();
  } else {
    snake.pop();
  }
  
  // 更新3D蛇
  updateSnakeMeshes();
  updateEyes(direction);
}

function updateSnakeMeshes() {
  // 移除旧网格
  snakeMeshes.forEach(m => {
    scene.remove(m);
    // dispose geometry & material
    m.geometry.dispose();
    if (Array.isArray(m.material)) {
      m.material.forEach(mat => mat.dispose());
    } else {
      m.material.dispose();
    }
  });
  snakeMeshes = [];
  
  // 创建新网格
  snake.forEach((seg, i) => {
    const isHead = i === 0;
    const mesh = createSnakeSegment(seg, isHead, i);
    snakeMeshes.push(mesh);
    scene.add(mesh);
  });
}

function gameOver3D() {
  gameRunning = false;
  finalScoreEl.textContent = `最终得分: ${score}`;
  gameOverEl.style.display = 'block';
  
  // 闪烁效果
  let flashCount = 0;
  const flashInterval = setInterval(() => {
    snakeMeshes.forEach(m => {
      m.material.emissiveIntensity = flashCount % 2 === 0 ? 1.0 : 0.1;
    });
    flashCount++;
    if (flashCount > 6) {
      clearInterval(flashInterval);
      snakeMeshes.forEach(m => {
        m.material.emissiveIntensity = 0.3;
      });
    }
  }, 200);
}

// ------- 游戏循环 -------
let lastTime = 0;

function gameLoop(time) {
  if (!gameRunning && gameLoopId) {
    // 仍然渲染场景（为了动画）
    controls.update();
    animateFood(time);
    updateParticles();
    renderer.render(scene, camera);
    gameLoopId = requestAnimationFrame(gameLoop);
    return;
  }
  
  const delta = time - lastTime;
  lastTime = time;
  
  moveTimer += delta;
  if (moveTimer >= MOVE_INTERVAL) {
    moveTimer -= MOVE_INTERVAL;
    moveSnake();
  }
  
  controls.update();
  animateFood(time);
  updateParticles();
  
  // 蛇身浮动动画
  snakeMeshes.forEach((mesh, i) => {
    const floatOffset = Math.sin(time * 0.003 + i * 0.5) * 0.03;
    const seg = snake[i];
    if (seg) {
      const targetY = 0.425 + floatOffset;
      mesh.position.y += (targetY - mesh.position.y) * 0.1;
    }
  });
  
  renderer.render(scene, camera);
  gameLoopId = requestAnimationFrame(gameLoop);
}

function animateFood(time) {
  if (foodMesh) {
    foodMesh.rotation.y = time * 0.002;
    foodMesh.position.y = Math.sin(time * 0.003) * 0.1;
    if (foodMesh.userData.ring) {
      foodMesh.userData.ring.rotation.z = time * 0.001;
    }
    if (foodMesh.userData.ring2) {
      foodMesh.userData.ring2.rotation.x = time * 0.001;
    }
  }
}

// ------- 键盘控制 -------
document.addEventListener('keydown', (e) => {
  const key = e.key;
  
  if (!gameRunning) {
    if (key === 'r' || key === 'R') {
      init();
    }
    return;
  }
  
  if ((key === 'ArrowUp' || key === 'w' || key === 'W') && direction.z !== 1) {
    nextDirection = { x: 0, z: -1 };
  } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && direction.z !== -1) {
    nextDirection = { x: 0, z: 1 };
  } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && direction.x !== 1) {
    nextDirection = { x: -1, z: 0 };
  } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && direction.x !== -1) {
    nextDirection = { x: 1, z: 0 };
  }
  
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(key)) {
    e.preventDefault();
  }
});

// 触摸控制（移动端）
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

document.addEventListener('touchmove', (e) => {
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (!gameRunning) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, z: 0 };
    else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, z: 0 };
  } else {
    if (dy > 0 && direction.z !== -1) nextDirection = { x: 0, z: 1 };
    else if (dy < 0 && direction.z !== 1) nextDirection = { x: 0, z: -1 };
  }
});

document.getElementById('restartBtn').addEventListener('click', init);

// ------- 窗口自适应 -------
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ------- 启动游戏 -------
init();

console.log('🐍 3D 贪吃蛇已启动！');
console.log('🎮 WASD / 方向键 控制方向');
console.log('🔄 鼠标拖拽旋转视角');
</script>
