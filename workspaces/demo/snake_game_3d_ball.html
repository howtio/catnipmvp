<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌀 3D 滚球贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;overflow:hidden}
.game-wrapper{position:relative;width:100vw;height:100vh;background:#0a0a1a}
#gameCanvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:bold;text-shadow:0 0 20px rgba(0,255,255,0.5);z-index:10;background:rgba(0,0,0,0.6);padding:10px 25px;border-radius:30px;border:1px solid rgba(0,255,255,0.3);backdrop-filter:blur(5px);display:flex;align-items:center;gap:30px}
.hud .score-label{color:#0ff}
.hud .score-value{color:#fff;font-size:26px}
.controls{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px}
.controls button{background:linear-gradient(135deg,#ff6ec7,#c44dff);color:#fff;border:none;padding:12px 35px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(196,77,255,0.3);letter-spacing:1px}
.controls button:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(196,77,255,0.5)}
.key-hint{color:rgba(255,255,255,0.4);font-size:13px;letter-spacing:1px}
.game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#ff6ec7;font-size:48px;font-weight:bold;text-shadow:0 0 40px rgba(255,110,199,0.8);display:none;text-align:center;line-height:1.4}
.game-over .sub{font-size:20px;color:rgba(255,255,255,0.7);text-shadow:none}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="hud"><span class="score-label">🏆 得分</span><span class="score-value" id="scoreDisplay">0</span></div>
<div id="gameOver" class="game-over">💥 游戏结束<br><span class="sub" id="finalScore">得分: 0</span><span class="sub" style="display:block;font-size:16px;margin-top:10px">按 R 重新开始</span></div>
<div id="gameCanvas"></div>
<div class="controls"><button id="restartBtn">🔄 重新开始</button><div class="key-hint">↑ ↓ ← → 或 WASD 控制方向 | 鼠标拖拽旋转视角</div></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import*as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const G=16,MI=260;
const c=document.getElementById('gameCanvas'),sD=document.getElementById('scoreDisplay'),gO=document.getElementById('gameOver'),fS=document.getElementById('finalScore');
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0a0a1a);sc.fog=new THREE.Fog(0x0a0a1a,14,28);
const cam=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,0.1,50);cam.position.set(12,12,12);cam.lookAt(G/2,0,G/2);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(c.clientWidth,c.clientHeight);r.setPixelRatio(Math.min(window.devicePixelRatio,2));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.0;c.appendChild(r.domElement);
const ct=new OrbitControls(cam,r.domElement);ct.target.set(G/2,0,G/2);ct.enableDamping=true;ct.dampingFactor=0.08;ct.minDistance=5;ct.maxDistance=28;ct.maxPolarAngle=Math.PI/2.1;ct.update();ct.enableRotate=true;ct.enablePan=false;
const al=new THREE.AmbientLight(0x404080,0.4);sc.add(al);
const dl=new THREE.DirectionalLight(0xffeedd,2.0);dl.position.set(12,22,8);dl.castShadow=true;dl.shadow.mapSize.width=1024;dl.shadow.mapSize.height=1024;dl.shadow.camera.near=0.1;dl.shadow.camera.far=40;dl.shadow.camera.left=-20;dl.shadow.camera.right=20;dl.shadow.camera.top=20;dl.shadow.camera.bottom=-20;sc.add(dl);
const fl=new THREE.DirectionalLight(0x4488ff,0.3);fl.position.set(-5,5,-10);sc.add(fl);
const bl=new THREE.DirectionalLight(0xff4488,0.3);bl.position.set(-5,3,12);sc.add(bl);
const gd=new THREE.Mesh(new THREE.CircleGeometry(G*0.7,64),new THREE.MeshStandardMaterial({color:0x111133,roughness:0.6,metalness:0.3,transparent:true,opacity:0.85,side:THREE.DoubleSide}));gd.rotation.x=-Math.PI/2;gd.position.set(G/2,-0.02,G/2);gd.receiveShadow=true;sc.add(gd);
const gh=new THREE.GridHelper(G,G,0x4466ff,0x2244aa);gh.position.set(G/2,0,G/2);gh.material.transparent=true;gh.material.opacity=0.25;sc.add(gh);
const ro=new THREE.Mesh(new THREE.RingGeometry(G*0.38,G*0.4,64),new THREE.MeshBasicMaterial({color:0x4466ff,transparent:true,opacity:0.15,side:THREE.DoubleSide}));ro.rotation.x=-Math.PI/2;ro.position.set(G/2,0.001,G/2);sc.add(ro);
function ccl(x,z){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.12,2.5,8),new THREE.MeshStandardMaterial({color:0x6666ff,emissive:0x4444ff,emissiveIntensity:0.4,transparent:true,opacity:0.4}));p.position.y=1.25;g.add(p);const b=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshStandardMaterial({color:0x8888ff,emissive:0x4466ff,emissiveIntensity:0.6}));b.position.y=2.5;g.add(b);g.position.set(x,0,z);sc.add(g)}
ccl(0,0);ccl(G,0);ccl(0,G);ccl(G,G);
const sg=new THREE.BufferGeometry();const sa=new Float32Array(800*3);const sc2=new Float32Array(800*3);for(let i=0;i<800;i++){sa[i*3]=(Math.random()-0.5)*120;sa[i*3+1]=Math.random()*40+2;sa[i*3+2]=(Math.random()-0.5)*120;const cc=new THREE.Color().setHSL(0.65+Math.random()*0.15,0.5,0.5+Math.random()*0.4);sc2[i*3]=cc.r;sc2[i*3+1]=cc.g;sc2[i*3+2]=cc.b}
sg.setAttribute('position',new THREE.BufferAttribute(sa,3));sg.setAttribute('color',new THREE.BufferAttribute(sc2,3));
const sm=new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending});
sc.add(new THREE.Points(sg,sm));
let snake=[],dir={x:1,z:0},nextDir={x:1,z:0},food=null,score=0,running=true,loopId=null,mT=0,snakeGroup=null,snakeBalls=[],foodMesh=null,eyes=[];
const ptG=new THREE.Group();sc.add(ptG);
const trG=new THREE.Group();sc.add(trG);
function mkBall(pos,idx,total,isHead){const g=new THREE.Group();const rad=isHead?0.45:0.38;const geo=new THREE.SphereGeometry(rad,24,24);let col,em;if(isHead){col=new THREE.Color(0xffffff);em=new THREE.Color(0x88ccff)}else{const t=idx/Math.max(total-1,1);col=new THREE.Color().setHSL(0.6-t*0.2,0.8,0.5);em=new THREE.Color().setHSL(0.6-t*0.2,0.9,0.3)}
const mat=new THREE.MeshPhysicalMaterial({color:col,emissive:em,emissiveIntensity:isHead?0.4:0.2,roughness:0.15,metalness:0.7,clearcoat:0.3,clearcoatRoughness:0.2});const sp=new THREE.Mesh(geo,mat);sp.castShadow=true;sp.receiveShadow=true;g.add(sp);
const gl=new THREE.Mesh(new THREE.SphereGeometry(rad*1.3,16,16),new THREE.MeshBasicMaterial({color:isHead?0x88ccff:0x4466ff,transparent:true,opacity:isHead?0.12:0.06,blending:THREE.AdditiveBlending}));g.add(gl);
if(isHead)mkEyes(g,dir);
g.position.set(pos.x+0.5,rad,pos.z+0.5);g.userData={isHead,idx,rad,sp,gl};return g}
function mkEyes(hg,d){eyes.forEach(e=>{if(e.parent)e.parent.remove(e)});eyes=[];
const wm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:0.2});const pm=new THREE.MeshStandardMaterial({color:0x111122});const im=new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x4488ff,emissiveIntensity:0.3});
const eg=new THREE.SphereGeometry(0.15,12,12);const ig=new THREE.SphereGeometry(0.08,12,12);const pg=new THREE.SphereGeometry(0.05,8,8);
let ps=[];const o=0.24,f=0.35;
if(d.x===1)ps=[[f,0.05,-o],[f,0.05,o]];else if(d.x===-1)ps=[[-f,0.05,-o],[-f,0.05,o]];else if(d.z===-1)ps=[[-o,0.05,-f],[o,0.05,-f]];else ps=[[-o,0.05,f],[o,0.05,f]];
ps.forEach(p=>{const e=new THREE.Mesh(eg,wm);e.position.set(p[0],p[1],p[2]);e.scale.set(1,0.6,0.7);hg.add(e);eyes.push(e);const ir=new THREE.Mesh(ig,im);ir.scale.set(0.9,0.9,0.5);ir.position.set(d.x*0.06,0,d.z*0.06);e.add(ir);const pu=new THREE.Mesh(pg,pm);pu.scale.set(0.8,0.8,0.5);pu.position.set(d.x*0.04,0,d.z*0.04);ir.add(pu)})}
function buildSnake(){if(snakeGroup){sc.remove(snakeGroup);snakeGroup.traverse(ch=>{if(ch.isMesh){ch.geometry.dispose();if(Array.isArray(ch.material))ch.material.forEach(m=>m.dispose());else ch.material.dispose()}})}
snakeGroup=new THREE.Group();snakeBalls=[];snake.forEach((seg,i)=>{const b=mkBall(seg,i,snake.length,i===0);snakeGroup.add(b);snakeBalls.push(b)});sc.add(snakeGroup)}
function updSnake(time){if(!snakeGroup)return;const da=Math.atan2(dir.z,dir.x);snake.forEach((seg,i)=>{const b=snakeBalls[i];if(!b)return;const rad=b.userData.rad;const tx=seg.x+0.5,tz=seg.z+0.5,fl=Math.sin(time*0.004+i*0.8)*0.04,ty=rad+fl;
b.position.x+=(tx-b.position.x)*0.15;b.position.z+=(tz-b.position.z)*0.15;b.position.y+=(ty-b.position.y)*0.1;
const sp=time*0.001;const rx=-dir.z*sp*0.08,rz=dir.x*sp*0.08;b.rotation.x=rx+Math.sin(time*0.002+i*0.5)*0.05;b.rotation.z=rz+Math.cos(time*0.002+i*0.5)*0.05;
if(!b.userData.isHead&&i>0&&i<snake.length-1){const sq=1+Math.sin(time*0.006+i*0.7)*0.04;b.scale.set(sq,1/sq,sq)}
if(b.userData.isHead){const br=1+Math.sin(time*0.005)*0.02;b.scale.set(br,br,br)}})}
function mkFood(pos){if(foodMesh){sc.remove(foodMesh);foodMesh=null}
const g=new THREE.Group();const cg=new THREE.SphereGeometry(0.35,24,24);const cm=new THREE.MeshPhysicalMaterial({color:0xff66aa,emissive:0xff2288,emissiveIntensity:0.5,roughness:0.05,metalness:0.1,clearcoat:0.5,clearcoatRoughness:0.1});const co=new THREE.Mesh(cg,cm);co.position.y=0.35;g.add(co);
const gw=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,16),new THREE.MeshBasicMaterial({color:0xff44aa,transparent:true,opacity:0.1,blending:THREE.AdditiveBlending}));gw.position.y=0.35;g.add(gw);
const rg=new THREE.TorusGeometry(0.55,0.025,8,32);const rm=new THREE.MeshStandardMaterial({color:0xff88cc,emissive:0xff44aa,emissiveIntensity:0.3,transparent:true,opacity:0.7});
const rh=new THREE.Mesh(rg,rm);rh.position.y=0.35;rh.rotation.x=Math.PI/2;g.add(rh);
const rv=new THREE.Mesh(rg.clone(),rm);rv.position.y=0.35;rv.rotation.z=Math.PI/2;g.add(rv);
const pc=12;const pg2=new THREE.BufferGeometry();const pp=new Float32Array(pc*3);for(let i=0;i<pc;i++){const a=(i/pc)*Math.PI*2;pp[i*3]=Math.cos(a)*0.65;pp[i*3+1]=Math.sin(a)*0.65*0.5;pp[i*3+2]=0}
pg2.setAttribute('position',new THREE.BufferAttribute(pp,3));const pm2=new THREE.PointsMaterial({color:0xffaadd,size:0.05,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending});
const pt=new THREE.Points(pg2,pm2);pt.position.y=0.35;g.add(pt);
g.position.set(pos.x+0.5,0,pos.z+0.5);g.userData={rh,rv,pt,co};sc.add(g);return g}
function animFood(time){if(foodMesh){foodMesh.rotation.y=time*0.0025;foodMesh.position.y=Math.sin(time*0.003)*0.12;if(foodMesh.userData.rh)foodMesh.userData.rh.rotation.z=time*0.0015;if(foodMesh.userData.rv)foodMesh.userData.rv.rotation.x=time*0.0015;if(foodMesh.userData.pt)foodMesh.userData.pt.rotation.z=time*0.002;if(foodMesh.userData.co){const s=1+Math.sin(time*0.005)*0.05;foodMesh.userData.co.scale.setScalar(s)}}}
function spawnEat(pos){const cnt=40;const geo=new THREE.BufferGeometry();const p=new Float32Array(cnt*3);const cols=new Float32Array(cnt*3);const vel=[];for(let i=0;i<cnt;i++){p[i*3]=pos.x+0.5;p[i*3+1]=0.5;p[i*3+2]=pos.z+0.5;const c=new THREE.Color().setHSL(0.55+Math.random()*0.25,0.9,0.5+Math.random()*0.4);cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;vel.push({x:(Math.random()-0.5)*0.25,y:Math.random()*0.2+0.05,z:(Math.random()-0.5)*0.25})}
geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
const mat=new THREE.PointsMaterial({size:0.1,vertexColors:true,transparent:true,opacity:1,blending:THREE.AdditiveBlending,sizeAttenuation:true});
const m=new THREE.Points(geo,mat);m.userData={vel,life:1.2};ptG.add(m)}
function updParticles(){const tr=[];ptG.children.forEach((m,i)=>{const p=m.geometry.attributes.position;const v=m.userData.vel;m.userData.life-=0.02;if(m.userData.life<=0){tr.push(i);return}m.material.opacity=m.userData.life;const sc=1+(1-m.userData.life)*3;m.scale.setScalar(sc);for(let j=0;j<v.length;j++){p.array[j*3]+=v[j].x;p.array[j*3+1]+=v[j].y;p.array[j*3+2]+=v[j].z;v[j].y-=0.01}p.needsUpdate=true});tr.reverse().forEach(i=>{const m=ptG.children[i];ptG.remove(m);m.geometry.dispose();m.material.dispose()})}
function updTrail(time){if(running&&snake.length>0&&Math.random()<0.4){const h=snake[0];const geo=new THREE.BufferGeometry();const p=new Float32Array(2*3);for(let i=0;i<2;i++){p[i*3]=h.x+0.5+(Math.random()-0.5)*0.3;p[i*3+1]=0.1+Math.random()*0.2;p[i*3+2]=h.z+0.5+(Math.random()-0.5)*0.3}
geo.setAttribute('position',new THREE.BufferAttribute(p,3));const mat=new THREE.PointsMaterial({color:0x88ccff,size:0.04,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,sizeAttenuation:true});const m=new THREE.Points(geo,mat);m.userData={life:1.0};trG.add(m)}
const tr=[];trG.children.forEach((m,i)=>{m.userData.life-=0.03;if(m.userData.life<=0){tr.push(i);return}m.material.opacity=m.userData.life;const p=m.geometry.attributes.position;for(let j=0;j<p.count;j++)p.array[j*3+1]+=0.01;p.needsUpdate=true});tr.reverse().forEach(i=>{const m=trG.children[i];trG.remove(m);m.geometry.dispose();m.material.dispose()})}
function init(){if(snakeGroup){sc.remove(snakeGroup);snakeGroup.traverse(ch=>{if(ch.isMesh){ch.geometry.dispose();if(Array.isArray(ch.material))ch.material.forEach(m=>m.dispose());else ch.material.dispose()}});snakeGroup=null}snakeBalls=[];eyes.forEach(e=>{if(e.parent)e.parent.remove(e)});eyes=[];
if(foodMesh){sc.remove(foodMesh);foodMesh=null}[ptG,trG].forEach(g=>{while(g.children.length>0){const m=g.children[0];g.remove(m);m.geometry.dispose();m.material.dispose()}});
const mid=Math.floor(G/2);snake=[{x:mid,z:mid},{x:mid-1,z:mid},{x:mid-2,z:mid}];dir={x:1,z:0};nextDir={x:1,z:0};score=0;running=true;mT=0;sD.textContent='0';gO.style.display='none';buildSnake();spawnFood();if(loopId)cancelAnimationFrame(loopId);loopId=requestAnimationFrame(gameLoop)}
function spawnFood(){let p;while(true){p={x:Math.floor(Math.random()*G),z:Math.floor(Math.random()*G)};if(!snake.some(s=>s.x===p.x&&s.z===p.z))break}food=p;foodMesh=mkFood(p)}
function moveSnake(){if(!running)return;dir={...nextDir};const h={x:snake[0].x+dir.x,z:snake[0].z+dir.z};if(h.x<0||h.x>=G||h.z<0||h.z>=G){gameOver();return}if(snake.some(s=>s.x===h.x&&s.z===h.z)){gameOver();return}snake.unshift(h);if(h.x===food.x&&h.z===food.z){score++;sD.textContent=score;spawnEat(food);spawnFood()}else{snake.pop()}rebuildSnake()}
function rebuildSnake(){if(snakeGroup){sc.remove(snakeGroup);snakeGroup.traverse(ch=>{if(ch.isMesh){ch.geometry.dispose();if(Array.isArray(ch.material))ch.material.forEach(m=>m.dispose());else ch.material.dispose()}})}snakeGroup=new THREE.Group();snakeBalls=[];snake.forEach((seg,i)=>{const b=mkBall(seg,i,snake.length,i===0);snakeGroup.add(b);snakeBalls.push(b)});sc.add(snakeGroup)}
function gameOver(){running=false;fS.textContent='最终得分: '+score;gO.style.display='block'}
let lt=0;function gameLoop(time){if(!running&&loopId){ct.update();animFood(time);updParticles();updTrail(time);r.render(sc,cam);loopId=requestAnimationFrame(gameLoop);return}
const dt=time-lt;lt=time;mT+=dt;if(mT>=MI){mT-=MI;moveSnake()}ct.update();animFood(time);updParticles();updTrail(time);updSnake(time);r.render(sc,cam);loopId=requestAnimationFrame(gameLoop)}
document.addEventListener('keydown',e=>{const k=e.key;if(!running){if(k==='r'||k==='R')init();return}
if((k==='ArrowUp'||k==='w'||k==='W')&&dir.z!==1)nextDir={x:0,z:-1};else if((k==='ArrowDown'||k==='s'||k==='S')&&dir.z!==-1)nextDir={x:0,z:1};else if((k==='ArrowLeft'||k==='a'||k==='A')&&dir.x!==1)nextDir={x:-1,z:0};else if((k==='ArrowRight'||k==='d'||k==='D')&&dir.x!==-1)nextDir={x:1,z:0};if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault()});
let tsX=0,tsY=0;document.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY});document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchend',e=>{if(!running)return;const dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nextDir={x:1,z:0};else if(dx<0&&dir.x!==1)nextDir={x:-1,z:0}}else{if(dy>0&&dir.z!==-1)nextDir={x:0,z:1};else if(dy<0&&dir.z!==1)nextDir={x:0,z:-1}}});
document.getElementById('restartBtn').addEventListener('click',init);
window.addEventListener('resize',()=>{const w=c.clientWidth,h=c.clientHeight;cam.aspect=w/h;cam.updateProjectionMatrix();r.setSize(w,h)});
init();console.log('🌀 3D 滚球贪吃蛇已启动！');console.log('🎮 WASD / 方向键控制方向');console.log('🔄 鼠标拖拽旋转视角');
</script>
</body>
