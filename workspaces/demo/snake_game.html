<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 粉色贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fce4ec;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
  }
  .game-wrapper {
    background: #fff0f5;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(233,30,99,0.2);
    text-align: center;
    border: 2px solid #f8bbd0;
  }
  h1 {
    color: #e91e63;
    margin-bottom: 15px;
    font-size: 28px;
    text-shadow: 0 0 10px rgba(233,30,99,0.3);
  }
  .score-board {
    color: #ad1457;
    font-size: 18px;
    margin-bottom: 15px;
  }
  .score-board span {
    color: #e91e63;
    font-weight: bold;
    font-size: 22px;
  }
  canvas {
    border: 2px solid #f8bbd0;
    border-radius: 8px;
    background: #fce4ec;
    display: block;
    margin: 0 auto;
    box-shadow: inset 0 0 30px rgba(233,30,99,0.1);
  }
  .controls {
    margin-top: 15px;
    color: #ad1457;
    font-size: 14px;
  }
  .controls button {
    background: #e91e63;
    color: #fff;
    border: none;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }
  .controls button:hover {
    background: #c2185b;
  }
  .game-over {
    color: #e91e63;
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 30px;
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <h1>🌸 粉色贪吃蛇</h1>
  <div class="score-board">
    得分: <span id="score">0</span>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <p>方向键 / WASD 控制方向</p>
    <button id="restartBtn">🔄 重新开始</button>
    <div class="game-over" id="gameOverMsg"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreSpan = document.getElementById('score');
const gameOverMsg = document.getElementById('gameOverMsg');

const GRID_SIZE = 20;
const CELL_SIZE = canvas.width / GRID_SIZE;

let snake, direction, nextDirection, food, score, gameLoop, gameRunning;

function init() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  gameRunning = true;
  gameOverMsg.textContent = '';
  scoreSpan.textContent = '0';
  spawnFood();
  draw();
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(update, 130);
}

function spawnFood() {
  let pos;
  while (true) {
    pos = {
      x: Math.floor(Math.random() * GRID_SIZE),
      y: Math.floor(Math.random() * GRID_SIZE)
    };
    if (!snake.some(s => s.x === pos.x && s.y === pos.y)) break;
  }
  food = pos;
}

function update() {
  if (!gameRunning) return;
  
  direction = {...nextDirection};
  
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };
  
  // 撞墙检测
  if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
    gameOver();
    return;
  }
  
  // 撞自身检测
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }
  
  snake.unshift(head);
  
  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreSpan.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }
  
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // 绘制网格线
  ctx.strokeStyle = '#f8bbd0';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID_SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL_SIZE, 0);
    ctx.lineTo(i * CELL_SIZE, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL_SIZE);
    ctx.lineTo(canvas.width, i * CELL_SIZE);
    ctx.stroke();
  }
  
  // 绘制食物 - 粉色爱心风格
  ctx.fillStyle = '#ff4081';
  ctx.shadowColor = '#ff4081';
  ctx.shadowBlur = 15;
  const fx = food.x * CELL_SIZE + CELL_SIZE/2;
  const fy = food.y * CELL_SIZE + CELL_SIZE/2;
  // 画小爱心
  ctx.beginPath();
  ctx.arc(fx - 3, fy - 1, 4, Math.PI * 1.25, Math.PI * 2.75);
  ctx.arc(fx + 3, fy - 1, 4, Math.PI * 1.25, Math.PI * 2.75);
  ctx.fill();
  ctx.fillRect(fx - 4, fy - 1, 8, 5);
  ctx.fillRect(fx - 1, fy + 1, 2, 4);
  
  // 绘制蛇
  snake.forEach((seg, i) => {
    const x = seg.x * CELL_SIZE;
    const y = seg.y * CELL_SIZE;
    const padding = 1;
    const radius = 6;
    
    if (i === 0) {
      // 蛇头 - 粉色
      ctx.fillStyle = '#f06292';
      ctx.shadowColor = '#f06292';
      ctx.shadowBlur = 8;
    } else {
      // 蛇身 - 粉色渐变
      const gradient = 1 - (i / snake.length) * 0.5;
      ctx.fillStyle = `rgba(240, 98, 146, ${gradient})`;
      ctx.shadowBlur = 0;
    }
    
    ctx.beginPath();
    ctx.roundRect(x + padding, y + padding, CELL_SIZE - padding*2, CELL_SIZE - padding*2, radius);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
  
  // 蛇头眼睛和腮红
  if (snake.length > 0) {
    const head = snake[0];
    const hx = head.x * CELL_SIZE;
    const hy = head.y * CELL_SIZE;
    
    // 眼睛
    ctx.fillStyle = '#fff';
    let eyeOffX1, eyeOffY1, eyeOffX2, eyeOffY2;
    if (direction.x === 1) {
      eyeOffX1 = 13; eyeOffY1 = 5; eyeOffX2 = 13; eyeOffY2 = 14;
    } else if (direction.x === -1) {
      eyeOffX1 = 5; eyeOffY1 = 5; eyeOffX2 = 5; eyeOffY2 = 14;
    } else if (direction.y === -1) {
      eyeOffX1 = 5; eyeOffY1 = 5; eyeOffX2 = 14; eyeOffY2 = 5;
    } else {
      eyeOffX1 = 5; eyeOffY1 = 14; eyeOffX2 = 14; eyeOffY2 = 14;
    }
    ctx.beginPath();
    ctx.arc(hx + eyeOffX1, hy + eyeOffY1, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + eyeOffX2, hy + eyeOffY2, 3, 0, Math.PI*2);
    ctx.fill();
    
    // 瞳孔
    ctx.fillStyle = '#880e4f';
    ctx.beginPath();
    ctx.arc(hx + eyeOffX1, hy + eyeOffY1, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + eyeOffX2, hy + eyeOffY2, 1.5, 0, Math.PI*2);
    ctx.fill();
    
    // 腮红
    ctx.fillStyle = 'rgba(255,138,167,0.4)';
    if (direction.x === 1) {
      ctx.beginPath();
      ctx.arc(hx + 15, hy + 10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + 4, hy + 10, 3, 0, Math.PI*2);
      ctx.fill();
    } else if (direction.x === -1) {
      ctx.beginPath();
      ctx.arc(hx + 15, hy + 10, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + 4, hy + 10, 3, 0, Math.PI*2);
      ctx.fill();
    } else if (direction.y === -1) {
      ctx.beginPath();
      ctx.arc(hx + 10, hy + 15, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + 9, hy + 4, 3, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(hx + 10, hy + 15, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + 9, hy + 4, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  gameOverMsg.textContent = '💔 游戏结束！点击重新开始';
}

// 键盘控制
document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  const key = e.key;
  
  if ((key === 'ArrowUp' || key === 'w' || key === 'W') && direction.y !== 1) {
    nextDirection = {x: 0, y: -1};
  } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && direction.y !== -1) {
    nextDirection = {x: 0, y: 1};
  } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && direction.x !== 1) {
    nextDirection = {x: -1, y: 0};
  } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && direction.x !== -1) {
    nextDirection = {x: 1, y: 0};
  }
  // 阻止箭头键滚动页面
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
    e.preventDefault();
  }
});

document.getElementById('restartBtn').addEventListener('click', init);

// roundRect polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w/2) r = w/2;
    if (r > h/2) r = h/2;
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// 启动游戏
init();
</script>
</body>
</html>
